[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# Always generate Python 3.7-compatible code.
target-version = "py37"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # flake8-comprehensions
    "C4",
    # flake8-pie
    "PIE",
    # flake8-return
    "RET",
    # flake8-quotes
    "Q",
    # flake8-self
    "SLF",
    # flake8-tidy-imports
    "TID",
    # ruff
    "RUF",
    # isort
    "I",
]
ignore = [
    "UP031"
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
